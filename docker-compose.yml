services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: xuanshu
      POSTGRES_USER: xuanshu
      POSTGRES_PASSWORD: xuanshu
    ports:
      - "5432:5432"
    volumes:
      - xuanshu-postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

volumes:
  xuanshu-postgres:
