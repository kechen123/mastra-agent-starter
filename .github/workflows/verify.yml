name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Verify backend
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test:contracts
          npx tsx tests/fixtures/skill-classifier.ts
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
# Schema 由 backend/database/init.sql 单文件提供；`npm run migrate` 在本地或生产执行。
# CI 不跑迁移（无 DB 服务）；依赖 contracts / unit / integration 测试 + typecheck 兜底。
