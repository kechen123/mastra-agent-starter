name: PostgreSQL Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    name: PostgreSQL integration (${{ matrix.rag-mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rag-mode: [core-only, rag-fixture]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: test_runner
          POSTGRES_DB: test_xuanshu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_runner -d test_xuanshu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RUN_DB_TESTS: '1'
      RUN_PG_TOOL_POLICY: '1'
      RUN_PG_MULTI_PROCESS: '1'
      RUN_PG_LEASE_FENCE: '1'
      RUN_PG_HARD_CRASH_LEASE: '1'
      TEST_DATABASE_URL: postgresql://test_runner:test_runner@127.0.0.1:5432/test_xuanshu?safety-identifier=test_ci
      EMBEDDING_PROVIDER: fixture
      EMBEDDING_MODEL: fixture-model
      EMBEDDING_API_KEY: ${{ matrix.rag-mode == 'rag-fixture' && 'fixture-non-secret-key' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run isolated PostgreSQL integration fixtures
        working-directory: backend
        run: npm run test:integration
